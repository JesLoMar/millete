worker_processes auto;
# Send NGINX errors to stderr so Docker can capture them
error_log /dev/stderr warn;
# PID in /tmp for rootless execution (no root privileges)
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # =============================================
    # LOGS: Sent to stdout/stderr for Docker
    # (no buffer parameters, they do not apply to streams)
    # =============================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    # Basic optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 10M;

    # Buffer settings
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    output_buffers 32 32k;
    postpone_output 1460;

    # Timeouts
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # Open file cache
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # =============================================
    # ENHANCED GZIP CONFIGURATION
    # =============================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_disable "msie6";
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        text/js
        text/x-js
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/rss+xml
        application/xhtml+xml
        application/x-font-ttf
        application/x-font-opentype
        application/vnd.ms-fontobject
        image/svg+xml
        image/x-icon
        font/ttf
        font/opentype
        font/eot
        font/otf;

    # =============================================
    # CONTENT SECURITY POLICY
    # Defensa principal contra XSS: solo recursos del propio origen.
    # - style-src 'unsafe-inline': necesario porque framer-motion y el
    #   confetti animan vía atributos style (riesgo bajo: CSS, no JS).
    # - connect-src 'self': la API va por el proxy /api/ (mismo origen).
    #   Si algún despliegue apunta VITE_API_URL a OTRO dominio, añadirlo aquí.
    # Recomendado: probar primero como Content-Security-Policy-Report-Only.
    # =============================================
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";

    # =============================================
    # MAIN SERVER
    # =============================================
    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # =============================================
        # HEALTH CHECK (for Docker)
        # =============================================
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # =============================================
        # NGINX STATUS (Monitoring)
        # =============================================
        location /nginx_status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            allow 172.20.0.0/16;
            deny all;
        }

        # =============================================
        # API: REVERSE PROXY TO BACKEND
        # =============================================
        location /api/ {
            proxy_pass http://millete-backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_cache_bypass $http_upgrade;

            # Optimized timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Proxy buffer settings
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }

        # =============================================
        # SPA: ROUTE ALL TRAFFIC TO INDEX.HTML
        # =============================================
        location / {
            try_files $uri $uri/ /index.html;

            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";

            # Modern security headers
            add_header Content-Security-Policy-Report-Only $csp always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        }

        # =============================================
        # STATIC ASSETS WITH LONG CACHE LIFETIME
        # =============================================
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Vary "Accept-Encoding";
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
            log_not_found off;

            etag off;
            if_modified_since off;
        }

        # =============================================
        # ROBOTS AND FAVICON
        # =============================================
        location = /robots.txt {
            access_log off;
            log_not_found off;
        }

        location = /favicon.ico {
            access_log off;
            log_not_found off;
            expires 30d;
        }

        # =============================================
        # SECURITY: DENY ACCESS TO HIDDEN FILES
        # =============================================
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        # =============================================
        # CUSTOM ERROR HANDLING
        # =============================================
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;

        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
