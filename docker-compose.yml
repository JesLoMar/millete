services:
  # =============================================
  # 1. POSTGRESQL DATABASE
  # =============================================
  postgres:
    image: postgres:16-alpine
    container_name: millete-db
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
      PGDATA: /var/lib/postgresql/data/pgdata

      # Used by init-app-user.sh
      APP_DB_PASSWORD: ${DATABASE_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-app-user.sh:/docker-entrypoint-initdb.d/01-init-app-user.sh:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d $${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - millete-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  # =============================================
  # 2. BACKEND (SPRING BOOT + JAVA 25)
  # =============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: millete-backend
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8080:8080"

    environment:
      # -----------------------------------------
      # DATABASE
      # -----------------------------------------
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME}
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USER}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD}

      # -----------------------------------------
      # SPRING
      # -----------------------------------------
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}

      # -----------------------------------------
      # AI - STRUCTURED EXTRACTION
      # -----------------------------------------
      MILLETE_AI_ENABLED: ${MILLETE_AI_ENABLED:-false}
      MILLETE_AI_BASE_URL: ${MILLETE_AI_BASE_URL:-http://host.docker.internal:11434/v1}
      MILLETE_AI_API_KEY: ${MILLETE_AI_API_KEY:-ollama}
      MILLETE_AI_MODEL: ${MILLETE_AI_MODEL:-qwen3:4b-instruct}
      MILLETE_AI_CONNECT_TIMEOUT: ${MILLETE_AI_CONNECT_TIMEOUT:-2s}
      MILLETE_AI_READ_TIMEOUT: ${MILLETE_AI_READ_TIMEOUT:-60s}

      # -----------------------------------------
      # VERDICT - INTENT CLASSIFICATION
      # -----------------------------------------
      MILLETE_AI_VERDICT_BASE_URL: ${VERDICT_BASE_URL:-http://verdict:8002}
      MILLETE_AI_VERDICT_DECIDER: ${VERDICT_DECIDER:-millete}
      MILLETE_AI_VERDICT_CONNECT_TIMEOUT: ${VERDICT_CONNECT_TIMEOUT:-2s}
      MILLETE_AI_VERDICT_READ_TIMEOUT: ${VERDICT_READ_TIMEOUT:-5s}

      # -----------------------------------------
      # LOGGING
      # -----------------------------------------
      LOGGING_LEVEL_ROOT: ${LOG_LEVEL:-INFO}

      # -----------------------------------------
      # JVM
      # -----------------------------------------
      JAVA_OPTS: "-Xmx512m -Xms256m"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8080/actuator/health"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

    networks:
      - millete-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  # =============================================
  # 3. FRONTEND (REACT + VITE + PNPM + NGINX)
  # =============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-0.2.0}

    container_name: millete-frontend
    restart: unless-stopped

    ports:
      - "${FRONTEND_PORT:-3000}:80"

    depends_on:
      backend:
        condition: service_started

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:80/health"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - millete-network


  # =============================================
  # 4. DAILY AUTOMATIC BACKUP
  # =============================================
  db-backup:
    image: postgres:16-alpine
    container_name: millete-db-backup
    restart: unless-stopped

    user: "1000:1000"

    env_file:
      - .env

    environment:
      PGHOST: postgres
      PGDATABASE: ${DATABASE_NAME}
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      BACKUP_RETENTION_DAYS: "7"

    volumes:
      - ./backups:/backups
      - ./scripts/restore.sh:/restore.sh:ro

    command: >
      sh -c '
        echo "===================================";
        echo "  Daily Backup System";
        echo "===================================";
        echo "Database: $${PGDATABASE}";
        echo "Host: $${PGHOST}";
        echo "User: $${PGUSER}";
        echo "Retention: $${BACKUP_RETENTION_DAYS} days";
        echo "===================================";

        LAST_BACKUP="";
        TODAY=$$(date +%Y%m%d);

        EXISTING_BACKUP=$$(ls -t /backups/$${PGDATABASE}_$${TODAY}*.sql.gz 2>/dev/null | head -1);

        if [ -n "$${EXISTING_BACKUP}" ]; then
          echo "[$$(date)] Today backup already exists: $$(basename "$${EXISTING_BACKUP}")";
          LAST_BACKUP="$${TODAY}";
        fi;

        while true; do
          HOUR=$$(date +%H);
          TODAY=$$(date +%Y%m%d);

          if [ "$${HOUR}" = "02" ] && [ "$${LAST_BACKUP}" != "$${TODAY}" ]; then
            TIMESTAMP=$$(date +%Y%m%d_%H%M%S);
            BACKUP_FILE="/backups/$${PGDATABASE}_$${TIMESTAMP}.sql.gz";

            echo "[$$(date)] Starting daily backup...";

            if PGPASSWORD="$${PGPASSWORD}" pg_dump \
                -h "$${PGHOST}" \
                -U "$${PGUSER}" \
                -d "$${PGDATABASE}" \
                --no-owner \
                --no-acl \
                | gzip > "$${BACKUP_FILE}"; then

              SIZE=$$(ls -lh "$${BACKUP_FILE}" | awk "{print \$$5}");

              echo "[$$(date)] Backup successful: $$(basename "$${BACKUP_FILE}") ($${SIZE})";

              LAST_BACKUP="$${TODAY}";

              DELETED=$$(find /backups \
                -name "$${PGDATABASE}_*.sql.gz" \
                -mtime +$${BACKUP_RETENTION_DAYS} \
                -delete \
                -print | wc -l);

              if [ "$${DELETED}" -gt 0 ]; then
                echo "[$$(date)] Cleaned $${DELETED} old backup(s) (>$${BACKUP_RETENTION_DAYS} days)";
              fi;

            else
              echo "[$$(date)] Backup failed";
            fi;
          fi;

          sleep 60;
        done
      '

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - millete-network

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"


  # =============================================
  # 5. OPTIONAL AI / VERDICT
  # =============================================
  verdict:
    profiles:
      - ai

    build:
      context: ./verdict
      dockerfile: Dockerfile

    container_name: millete-verdict
    restart: unless-stopped

    expose:
      - "8002"

    volumes:
      - verdict_hf:/data/huggingface
      - ./verdict:/workspace

    environment:
      HF_HOME: /data/huggingface
      HF_HUB_DISABLE_TELEMETRY: "1"

    entrypoint:
      - verdict
      - serve

    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8002"
      - "--decider"
      - "/workspace/millete.verdict"

    networks:
      - millete-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


# =============================================
# PERSISTENT VOLUMES
# =============================================
volumes:
  postgres_data:
    name: millete_postgres_data
    external: true

  verdict_hf:
    name: millete_verdict_hf


# =============================================
# INTERNAL NETWORK
# =============================================
networks:
  millete-network:
    name: millete_network
    driver: bridge

    ipam:
      config:
        - subnet: 172.20.0.0/16