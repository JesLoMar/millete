  # =========================================================================
  # CONFIGURACIÓN GENERAL DE MILLETE
  # =========================================================================

  server:
    port: ${APP_PORT:8080}
    forward-headers-strategy: native

  spring:
    application:
      name: Millete

    profiles:
      active: ${SPRING_PROFILES_ACTIVE:dev}

    servlet:
      multipart:
        max-file-size: 10MB
        max-request-size: 10MB

    # =======================================================================
    # DATABASE
    # =======================================================================
    datasource:
      url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/millete_db}
      username: ${SPRING_DATASOURCE_USERNAME:postgres}
      password: ${SPRING_DATASOURCE_PASSWORD:}
      driver-class-name: org.postgresql.Driver

    # =======================================================================
    # JPA / HIBERNATE
    # =======================================================================
    jpa:
      open-in-view: false
      hibernate:
        ddl-auto: validate
      show-sql: false
      properties:
        hibernate:
          format_sql: true

    # =======================================================================
    # FLYWAY
    # =======================================================================
    flyway:
      enabled: true
      baseline-on-migrate: true

  # =========================================================================
  # APLICACIÓN
  # =========================================================================

  app:
    version: 0.1.4

  # =========================================================================
  # JWT
  # =========================================================================

  jwt:
    secret: ${JWT_SECRET}
    expiration: 43200000
    cookie-name: __Host-ms_token
    cookie-secure: ${COOKIE_SECURE:true}
    cookie-http-only: true
    cookie-same-site: Strict
    cookie-path: /
    cookie-max-age: 43200

  # =========================================================================
  # LOGGING
  # =========================================================================

  logging:
    level:
      root: ${LOG_LEVEL:INFO}
      com.puntomartinez: DEBUG